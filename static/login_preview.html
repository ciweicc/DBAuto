<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>豆瓣自动转存 - 登录</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<script>
/* FOUC 防闪烁：在 CSS 之前同步设置主题 */
(function(){var t=localStorage.getItem('theme')||'dark';document.documentElement.setAttribute('data-theme',t)})();
</script>
<style>
:root {
  --bg:#0d0d10; --bg-deep:#08080b; --card:#16161a; --card-2:#1c1c22;
  --border:rgba(255,255,255,.08); --border2:rgba(255,255,255,.12); --border3:rgba(255,255,255,.18);
  /* 对比度修正：次要文字从 .45 提到 .55，四级文字从 .30 提到 .42（对齐 WCAG AA） */
  --text:#ffffff; --text2:rgba(255,255,255,.72); --text3:rgba(255,255,255,.55); --text4:rgba(255,255,255,.42);
  --accent:#0a84ff; --accent2:#5e5ce6; --accent3:#8585ff;
  --green:#30d158; --red:#ff453a; --orange:#ff9f0a; --purple:#bf5af2; --cyan:#64d2ff;
  --radius:8px; --radius-sm:6px; --radius-xs:4px; --radius-lg:12px; --radius-xl:14px;
  --blur:none; --blur-xl:none;
  --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-sm:none; --shadow-glow:none;
  --shadow-card:0 24px 60px -20px rgba(0,0,0,.7), 0 2px 8px rgba(0,0,0,.4);
  --font-display:-apple-system,BlinkMacSystemFont,'SF Pro Display','PingFang SC','Microsoft YaHei','Helvetica Neue',sans-serif;
  --font:-apple-system,BlinkMacSystemFont,'SF Pro Text','PingFang SC','Microsoft YaHei','Helvetica Neue',sans-serif;
  --mono:'SF Mono','Cascadia Code','Fira Code',Consolas,monospace;
  --space-xs:4px; --space-sm:8px; --space-md:12px; --space-lg:16px; --space-xl:20px; --space-2xl:24px; --space-3xl:32px;
  --transition-fast:.15s cubic-bezier(.4,0,.2,1);
  --transition-normal:.25s cubic-bezier(.4,0,.2,1);
  --transition-slow:.4s cubic-bezier(.4,0,.2,1);
}
[data-theme="light"] {
  --bg:#f2f2f7; --bg-deep:#e9e9ee; --card:#ffffff; --card-2:#f4f4f8;
  --border:rgba(0,0,0,.08); --border2:rgba(0,0,0,.12); --border3:rgba(0,0,0,.18);
  --text:#1c1c1e; --text2:rgba(0,0,0,.60); --text3:rgba(0,0,0,.50); --text4:rgba(0,0,0,.42);
  --accent:#007aff; --accent2:#5856d6; --accent3:#8e8dff;
  --green:#34c759; --red:#ff3b30; --orange:#ff9500; --purple:#af52de; --cyan:#00a3ff;
  --shadow:0 1px 2px rgba(0,0,0,.1); --shadow-sm:none; --shadow-glow:none;
  --shadow-card:0 24px 60px -24px rgba(20,20,40,.22), 0 2px 8px rgba(0,0,0,.06);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:var(--font);color:var(--text);
  min-height:100vh;min-height:100dvh;
  -webkit-font-smoothing:antialiased;line-height:1.5;overflow:hidden;
  background:var(--bg);
}

/* ===== 全局焦点环（修复审计报告 #2） ===== */
:focus{outline:none}
:focus-visible{
  outline:2px solid var(--accent);
  outline-offset:2px;
  border-radius:var(--radius-sm);
}

/* ===== 双栏布局 ===== */
.login-page{display:flex;min-height:100vh;min-height:100dvh}

/* 左：品牌区 */
.brand-panel{
  position:relative;flex:0 0 46%;max-width:640px;overflow:hidden;
  padding:var(--space-3xl);
  display:flex;flex-direction:column;justify-content:space-between;
  background-color:#0a0a0d;
  background-image:
    linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px),
    radial-gradient(1100px 620px at 18% 8%, rgba(10,132,255,.28), transparent 60%),
    radial-gradient(900px 520px at 88% 92%, rgba(94,92,230,.24), transparent 55%),
    linear-gradient(135deg, #0d0d10, #08080b);
  background-size:40px 40px,40px 40px,100% 100%,100% 100%,100% 100%;
  background-attachment:fixed,fixed,scroll,scroll,scroll;
  color:#fff;
}
[data-theme="light"] .brand-panel{
  background-color:#eef0f6;
  background-image:
    linear-gradient(rgba(0,0,0,.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,0,0,.05) 1px, transparent 1px),
    radial-gradient(1100px 620px at 18% 8%, rgba(10,122,255,.16), transparent 60%),
    radial-gradient(900px 520px at 88% 92%, rgba(88,86,214,.14), transparent 55%),
    linear-gradient(135deg, #ffffff, #eef0f6);
  background-size:40px 40px,40px 40px,100% 100%,100% 100%,100% 100%;
  background-attachment:fixed,fixed,scroll,scroll,scroll;
  color:#1c1c1e;
}
/* 装饰光斑 */
.brand-glow{position:absolute;width:380px;height:380px;border-radius:50%;
  background:radial-gradient(circle, rgba(10,132,255,.35), transparent 70%);
  filter:blur(10px);top:-120px;right:-120px;pointer-events:none}
.brand-panel .brand-inner{position:relative;z-index:1;display:flex;flex-direction:column;gap:var(--space-2xl)}
.brand-head{display:flex;align-items:center;gap:14px}
.brand-logo{
  width:64px;height:64px;border-radius:var(--radius-lg);flex-shrink:0;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 10px 30px -8px rgba(10,132,255,.6);
}
.brand-logo svg{width:34px;height:34px;color:#fff}
.brand-name{font-family:var(--font-display);font-size:22px;font-weight:700;letter-spacing:-.3px}
.brand-ver{font-size:12px;font-weight:600;color:rgba(255,255,255,.6);background:rgba(255,255,255,.1);
  padding:2px 8px;border-radius:20px;margin-left:4px}
[data-theme="light"] .brand-ver{color:rgba(0,0,0,.5);background:rgba(0,0,0,.06)}

.brand-hero{margin-top:var(--space-xl)}
.brand-hero h1{
  font-family:var(--font-display);font-size:34px;line-height:1.25;font-weight:700;letter-spacing:-.6px;
  background:linear-gradient(135deg,rgba(255,255,255,.98) 0%,rgba(100,210,255,.95) 55%,rgba(200,150,255,.92) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
[data-theme="light"] .brand-hero h1{
  background:linear-gradient(135deg,rgba(28,28,30,.95) 0%,rgba(0,122,255,.9) 55%,rgba(175,82,222,.88) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.brand-hero p{margin-top:12px;font-size:15px;color:rgba(255,255,255,.62);max-width:30ch}
[data-theme="light"] .brand-hero p{color:rgba(0,0,0,.55)}

.brand-feats{display:flex;flex-direction:column;gap:14px;margin-top:var(--space-lg)}
.feat{display:flex;align-items:center;gap:14px}
.feat-ic{
  width:40px;height:40px;border-radius:var(--radius);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);color:var(--cyan);
}
[data-theme="light"] .feat-ic{background:rgba(0,0,0,.04);border-color:rgba(0,0,0,.06);color:var(--accent)}
.feat-ic svg{width:20px;height:20px}
.feat-tx b{display:block;font-size:14px;font-weight:600;color:rgba(255,255,255,.92)}
[data-theme="light"] .feat-tx b{color:rgba(0,0,0,.85)}
.feat-tx span{font-size:12.5px;color:rgba(255,255,255,.55)}
[data-theme="light"] .feat-tx span{color:rgba(0,0,0,.5)}

.brand-foot{position:relative;z-index:1;font-size:12px;color:rgba(255,255,255,.4)}
[data-theme="light"] .brand-foot{color:rgba(0,0,0,.4)}

/* 图标承载元素（修复：原 login_new.html 有 .icon 体系，重写时漏搬导致按钮内图标尺寸错乱） */
.icon{display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;flex-shrink:0}
.icon svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon-16{width:16px;height:16px}
.icon-18{width:18px;height:18px}
.icon-20{width:20px;height:20px}
.icon-24{width:24px;height:24px}

/* 右：表单区 —— 独立表面底色，避免透出纯黑 body 导致“黑窟窿/无内容”观感 */
.form-panel{
  position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:var(--space-2xl);padding:var(--space-2xl);width:100%;
  background-color:#0a0a0d;
  background-image:
    radial-gradient(42% 48% at 12% 16%, rgba(10,132,255,.22), transparent 60%),
    radial-gradient(52% 56% at 88% 82%, rgba(94,92,230,.24), transparent 60%),
    radial-gradient(40% 44% at 74% 10%, rgba(100,210,255,.12), transparent 60%),
    linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px),
    linear-gradient(180deg,#101014 0%,#0a0a0d 100%);
  background-size:100% 100%,100% 100%,100% 100%,40px 40px,40px 40px,100% 100%;
  background-attachment:scroll,scroll,scroll,fixed,fixed,scroll;
  overflow-y:auto;
}
[data-theme="light"] .form-panel{
  background-color:#eef0f6;
  background-image:
    radial-gradient(42% 48% at 12% 16%, rgba(10,122,255,.12), transparent 60%),
    radial-gradient(52% 56% at 88% 82%, rgba(88,86,214,.14), transparent 60%),
    radial-gradient(40% 44% at 74% 10%, rgba(0,163,255,.10), transparent 60%),
    linear-gradient(rgba(0,0,0,.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,0,0,.05) 1px, transparent 1px),
    linear-gradient(180deg,#ffffff 0%,#f2f2f7 100%);
  background-size:100% 100%,100% 100%,100% 100%,40px 40px,40px 40px,100% 100%;
  background-attachment:scroll,scroll,scroll,fixed,fixed,scroll;
}
.theme-btn{
  position:absolute;top:var(--space-md);right:var(--space-md);
  width:38px;height:38px;border-radius:var(--radius-sm);border:1px solid var(--border);
  background:var(--card-2);color:var(--text2);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all var(--transition-normal);z-index:2;
}
.theme-btn:hover{background:rgba(10,132,255,.1);border-color:var(--accent);color:var(--accent);
  transform:translateY(-2px);box-shadow:0 6px 16px rgba(10,132,255,.2)}
.theme-btn:active{transform:translateY(0) scale(.95)}

.login-card{
  position:relative;z-index:1;
  background:rgba(22,22,26,.5);
  border:1px solid rgba(255,255,255,.14);border-radius:var(--radius-xl);
  padding:var(--space-3xl) var(--space-2xl);width:440px;max-width:100%;
  box-shadow:0 24px 60px -20px rgba(0,0,0,.7), 0 8px 24px rgba(0,0,0,.35),
    inset 0 1px 0 rgba(255,255,255,.18), inset 0 0 0 1px rgba(255,255,255,.04);
  -webkit-backdrop-filter:blur(26px) saturate(160%);
  backdrop-filter:blur(26px) saturate(160%);
  transition:border-color var(--transition-normal), box-shadow var(--transition-normal);
}
.login-card:hover{border-color:rgba(255,255,255,.28);box-shadow:0 28px 70px -20px rgba(0,0,0,.75), 0 8px 24px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.22), inset 0 0 0 1px rgba(255,255,255,.06)}
[data-theme="light"] .login-card{
  background:rgba(255,255,255,.5);
  border-color:rgba(255,255,255,.7);
  box-shadow:0 24px 60px -24px rgba(20,20,40,.22), 0 8px 24px rgba(20,20,40,.08),
    inset 0 1px 0 rgba(255,255,255,.9);
}
.login-card h1{
  font-size:25px;font-weight:700;letter-spacing:-.4px;margin-bottom:6px;
  font-family:var(--font-display);
}
.login-subtitle{font-size:13px;color:var(--text3);margin-bottom:var(--space-2xl)}

.form-group{margin-bottom:var(--space-lg);position:relative}
.form-group label{
  display:block;font-size:12px;color:var(--text2);margin-bottom:var(--space-xs);
  font-weight:600;font-family:var(--font-display);letter-spacing:.3px;
  transition:all var(--transition-fast);
}
.form-group:focus-within label{color:var(--accent)}
.form-group .input-wrap{position:relative}
.form-group input{
  width:100%;padding:13px 16px 13px 44px;border-radius:var(--radius-sm);
  border:1px solid var(--border);background:var(--card-2);
  color:var(--text);font-size:15px;font-family:var(--font);
  transition:all var(--transition-normal);
}
[data-theme="light"] .form-group input{background:rgba(0,0,0,.02)}
.form-group input::placeholder{color:var(--text4)}
.form-group input:hover{border-color:var(--border2)}
.form-group input:focus{
  outline:none;border-color:var(--accent);
  box-shadow:0 0 0 4px rgba(10,132,255,.15),0 0 24px rgba(10,132,255,.1);
  background:rgba(255,255,255,.05);
}
.form-group .input-icon{
  position:absolute;left:14px;top:50%;transform:translateY(-50%);
  color:var(--text3);transition:color var(--transition-fast);
}
.form-group:focus-within .input-icon{color:var(--accent)}
.form-group .toggle-pass{
  position:absolute;right:10px;top:50%;transform:translateY(-50%);
  width:32px;height:32px;border-radius:8px;border:none;background:transparent;
  color:var(--text3);cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all var(--transition-fast);
}
.form-group .toggle-pass:hover{color:var(--accent);background:rgba(10,132,255,.08)}

.btn{
  width:100%;padding:13px;border-radius:var(--radius-sm);border:none;
  background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:15px;font-weight:600;
  cursor:pointer;margin-top:var(--space-sm);font-family:var(--font-display);
  transition:filter var(--transition-normal);
  position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:var(--space-sm);
  letter-spacing:.3px;
}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(0) scale(.98)}
.btn:disabled{opacity:.6;cursor:not-allowed;filter:none;transform:none}
.btn .spinner{width:18px;height:18px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}

.error{color:var(--red);font-size:13px;text-align:center;margin-top:var(--space-md);
  display:none;padding:12px;border-radius:var(--radius-xs);
  background:rgba(255,69,58,.08);border:1px solid rgba(255,69,58,.2);
  font-weight:500;}
.error.show{display:block;animation:errorShake .4s ease, errorFadeIn .3s ease}
@keyframes errorShake{
  0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}
  60%{transform:translateX(-4px)}80%{transform:translateX(4px)}
}
@keyframes errorFadeIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}

.login-last{
  margin-top:var(--space-lg);text-align:center;font-size:12px;color:var(--text3);
  display:none;align-items:center;justify-content:center;gap:6px;
}
.login-last.show{display:flex}
.login-last svg{width:14px;height:14px;color:var(--text3);flex-shrink:0}
/* 登录辅助信息（填实右侧、给首次部署者引导） */
.login-note{
  position:relative;z-index:1;
  width:440px;max-width:100%;display:flex;align-items:center;gap:12px;
  padding:12px 14px;border-radius:var(--radius);border:1px solid rgba(255,255,255,.12);
  background:rgba(28,28,34,.45);color:var(--text3);font-size:12.5px;line-height:1.5;
  -webkit-backdrop-filter:blur(16px) saturate(150%);backdrop-filter:blur(16px) saturate(150%);
}
[data-theme="light"] .login-note{background:rgba(255,255,255,.55);border-color:rgba(255,255,255,.7)}
.login-note svg{width:18px;height:18px;flex-shrink:0;color:var(--accent)}
.login-note b{color:var(--text2);font-weight:600}
.login-footer{margin-top:0;text-align:center;font-size:12px;color:var(--text4);position:relative;z-index:1}

/* 液态玻璃：登录卡片背后缓慢漂移的模糊光球 */
.liquid-bg{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.liquid-bg span{position:absolute;border-radius:50%;filter:blur(64px);opacity:.6;mix-blend-mode:screen}
.liquid-bg span:nth-child(1){width:52%;height:52%;left:-6%;top:-4%;background:radial-gradient(circle,#0a84ff 0%,transparent 70%);animation:liquid1 18s ease-in-out infinite alternate}
.liquid-bg span:nth-child(2){width:58%;height:58%;right:-10%;bottom:-8%;background:radial-gradient(circle,#5e5ce6 0%,transparent 70%);animation:liquid2 23s ease-in-out infinite alternate}
.liquid-bg span:nth-child(3){width:44%;height:44%;right:26%;top:-12%;background:radial-gradient(circle,#64d2ff 0%,transparent 70%);animation:liquid3 20s ease-in-out infinite alternate}
[data-theme="light"] .liquid-bg span{mix-blend-mode:multiply;opacity:.42}
@keyframes liquid1{from{transform:translate(0,0) scale(1)}to{transform:translate(22%,14%) scale(1.18)}}
@keyframes liquid2{from{transform:translate(0,0) scale(1)}to{transform:translate(-16%,-12%) scale(1.22)}}
@keyframes liquid3{from{transform:translate(0,0) scale(1)}to{transform:translate(-12%,20%) scale(1.12)}}

/* ===== 响应式：移动端单栏 ===== */
@media(max-width:860px){
  .login-page{flex-direction:column}
  .brand-panel{flex:none;max-width:none;padding:var(--space-2xl) var(--space-xl);
    flex-direction:row;align-items:center;gap:14px}
  .brand-glow{display:none}
  .brand-inner{flex-direction:row;align-items:center;gap:14px;width:100%}
  .brand-head{gap:12px}
  .brand-logo{width:48px;height:48px;border-radius:var(--radius)}
  .brand-logo svg{width:26px;height:26px}
  .brand-name{font-size:18px}
  .brand-ver{font-size:11px}
  .brand-hero,.brand-feats,.brand-foot{display:none}
  .form-panel{padding:var(--space-2xl) var(--space-md)}
}
@media(max-width:480px){
  .login-card{width:94%;padding:var(--space-2xl) var(--space-xl)}
  .login-card h1{font-size:22px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}
</style>
</head>

    <path d="M12 12v9"/><path d="m8 17 4 4 4-4"/>
  </symbol>
  <symbol id="icon-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
  </symbol>
  <symbol id="icon-check-circle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>
  </symbol>
</svg>

<div class="login-page">
  <!-- 左：品牌区 -->
  <aside class="brand-panel">
    <div class="brand-glow"></div>
    <div class="brand-inner">
      <div class="brand-head">
        <div class="brand-logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#icon-cloud-download"/></svg></div>
        <div class="brand-name">豆瓣自动转存<span class="brand-ver">v1.1.0</span></div>
      </div>
      <div class="brand-hero">
        <h1>把豆瓣榜单，<br>自动搬进你的网盘</h1>
        <p>本地 / NAS 部署的影视自动转存后台，省去逐个手动检索。</p>
      </div>
      <div class="brand-feats">
        <div class="feat">
          <div class="feat-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#icon-cloud-download"/></svg></div>
          <div class="feat-tx"><b>一键转存</b><span>豆瓣 / 榜单资源批量转存到网盘</span></div>
        </div>
        <div class="feat">
          <div class="feat-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#icon-clock"/></svg></div>
          <div class="feat-tx"><b>定时调度</b><span>按你设定的时间自动执行</span></div>
        </div>
        <div class="feat">
          <div class="feat-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#icon-check-circle"/></svg></div>
          <div class="feat-tx"><b>失败监控</b><span>实时日志与状态，成功失败一目了然</span></div>
        </div>
      </div>
    </div>
    <div class="brand-foot">© 2026 DBAuto · 数据本地加密存储</div>
  </aside>

  <!-- 右：表单区 -->
  <main class="form-panel">
    <div class="liquid-bg"><span></span><span></span><span></span></div>
    <button class="theme-btn" id="themeBtn" onclick="toggleTheme()" title="切换主题" aria-label="切换主题"><span class="icon icon-20"><svg><use href="#icon-moon"/></svg></span></button>
    <div class="login-card">
      <h1>登录</h1>
      <p class="login-subtitle">登录以管理您的影视自动转存</p>
      <div class="form-group">
        <label for="user">用户名</label>
        <div class="input-wrap">
          <span class="input-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#icon-user"/></svg></span>
          <input type="text" id="user" placeholder="请输入用户名" onkeydown="if(event.key==='Enter')focusPass()">
        </div>
      </div>
      <div class="form-group">
        <label for="pass">密码</label>
        <div class="input-wrap">
          <span class="input-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#icon-lock"/></svg></span>
          <input type="password" id="pass" placeholder="请输入密码" onkeydown="if(event.key==='Enter')login()">
          <button class="toggle-pass" onclick="togglePass()" title="显示/隐藏密码" id="passToggleBtn" aria-label="显示或隐藏密码">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#icon-eye"/></svg>
          </button>
        </div>
      </div>
      <button class="btn" id="btn" onclick="login()">登 录</button>
      <div class="error" id="error"></div>
      <p class="login-last" id="loginLast"></p>
    </div>
    <div class="login-note">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#icon-lock"/></svg>
      <span><b>首次部署？</b>默认账号信息请在服务端配置文件中查看。账号密码经本地加密存储，登录流量仅在您的内网 / 本机间传输，不会上传第三方。</span>
    </div>
    <p class="login-footer">安全登录 · 数据本地加密存储</p>
  </main>
</div>

<script>
var passVisible = false;

function initTheme(){
  var t = localStorage.getItem('theme')||'dark';
  document.documentElement.setAttribute('data-theme',t);
  var icon = t==='dark'?'icon-moon':'icon-sun';
  document.querySelector('#themeBtn .icon').innerHTML = '<svg><use href="#'+icon+'"/></svg>';
}
function toggleTheme(){
  var cur = document.documentElement.getAttribute('data-theme');
  var next = cur==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',next);
  localStorage.setItem('theme',next);
  var icon = next==='dark'?'icon-moon':'icon-sun';
  document.querySelector('#themeBtn .icon').innerHTML = '<svg><use href="#'+icon+'"/></svg>';
}
initTheme();

function focusPass(){document.getElementById('pass').focus()}

var lockTimer = null;

// 显示上次登录时间 / IP（本地缓存，下次访问登录页时提示）
function showLastLogin(){
  try{
    var raw = localStorage.getItem('dbauto_last_login');
    if(!raw) return;
    var rec = JSON.parse(raw);
    if(!rec || !rec.time) return;
    var el = document.getElementById('loginLast');
    if(!el) return;
    el.textContent = '';
    var svgns = 'http://www.w3.org/2000/svg';
    var icon = document.createElementNS(svgns,'svg');
    icon.setAttribute('viewBox','0 0 24 24');
    icon.setAttribute('fill','none');
    icon.setAttribute('stroke','currentColor');
    icon.setAttribute('stroke-width','2');
    icon.setAttribute('stroke-linecap','round');
    icon.setAttribute('stroke-linejoin','round');
    var use = document.createElementNS(svgns,'use');
    use.setAttribute('href','#icon-clock');
    icon.appendChild(use);
    el.appendChild(icon);
    var span = document.createElement('span');
    var txt = '上次登录：' + rec.time;
    if(rec.ip) txt += ' · ' + rec.ip;
    span.textContent = txt;
    el.appendChild(span);
    el.classList.add('show');
  }catch(e){}
}

// 锁定倒计时
function startLockCountdown(wait){
  var btn = document.getElementById('btn');
  var err = document.getElementById('error');
  if(lockTimer){clearInterval(lockTimer);lockTimer=null}
  btn.disabled = true;
  var left = wait || 300;
  function fmt(s){var m=Math.floor(s/60),sec=s%60;return m+' 分 '+(sec<10?'0':'')+sec+' 秒'}
  function tick(){
    if(left<=0){
      if(lockTimer){clearInterval(lockTimer);lockTimer=null}
      err.classList.remove('show');
      btn.disabled=false;
      btn.innerHTML='登 录';
      return;
    }
    err.textContent='尝试次数过多，账号已锁定，请 '+fmt(left)+' 后重试';
    err.classList.add('show');
    btn.innerHTML='已锁定 '+fmt(left);
    left--;
  }
  tick();
  lockTimer=setInterval(tick,1000);
}

function togglePass(){
  passVisible = !passVisible;
  var input = document.getElementById('pass');
  var btn = document.getElementById('passToggleBtn');
  input.type = passVisible ? 'text' : 'password';
  btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#'+(passVisible?'icon-eye-off':'icon-eye')+'"/></svg>';
}

if(localStorage.getItem('auth_token')){
  var tok = localStorage.getItem('auth_token');
  fetch('/api/categories',{headers:{'X-Auth-Token':tok}}).then(function(r){
    if(r.ok)location.href='/';
    else localStorage.removeItem('auth_token');
  });
}
showLastLogin();

async function login(){
  var user = document.getElementById('user').value.trim();
  var pass = document.getElementById('pass').value;
  var btn = document.getElementById('btn');
  var err = document.getElementById('error');
  var success = false;

  err.classList.remove('show');
  if(!user){err.textContent='请输入用户名';err.classList.add('show');return}
  if(!pass){err.textContent='请输入密码';err.classList.add('show');return}

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> 登录中...';

  try{
    var r = await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:user,password:pass})});
    var d = await r.json();
    if(d.success){
      success = true;
      if(d.last_login){localStorage.setItem('dbauto_last_login', JSON.stringify(d.last_login))}
      btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg> 登录成功';
      localStorage.setItem('auth_token',d.token);
      setTimeout(function(){location.href='/'},500);
    } else if(r.status === 429){
      startLockCountdown(d.wait || 300);
    } else {
      var remain = (typeof d.remaining === 'number') ? d.remaining : null;
      var msg = d.message || '登录失败，请检查用户名和密码';
      if(remain !== null && remain > 0){ msg += '（还剩 ' + remain + ' 次尝试机会）'; }
      err.textContent = msg;
      err.classList.add('show');
    }
  }catch(e){
    err.textContent = '网络连接失败，请检查网络';
    err.classList.add('show');
  }
  if(!success){
    btn.disabled = false;
    btn.innerHTML = '登 录';
  }
}
</script>
</body>
</html>
