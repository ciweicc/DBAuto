<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>豆瓣自动转存 - 登录</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<script>
/* FOUC 防闪烁：在 CSS 之前同步设置主题 */
(function(){var t=localStorage.getItem('theme')||'dark';document.documentElement.setAttribute('data-theme',t)})();
</script>
<link rel="stylesheet" href="/static/src/styles/tokens.css">
<style>
/* =========================================================
   登录页样式
   设计 token 单一出处：tokens.css（与主页同一份）。
   本文件**只允许**使用 token 变量，禁止再定义 --text / --border 等
   已在 tokens.css 里存在的令牌 —— 历史上正是这里的深色硬编码
   （--text:#ffffff）在浅色主题下覆盖了 tokens.css 的 --text:#1c1c1e，
   导致整个登录页「白字白底」，主标题几乎不可见（issue #27）。
   ========================================================= */

/* 只有登录页才会用到的尺寸补两个局部令牌（其余一律取自 tokens.css） */
:root{
  --login-card-w:440px;
  --login-panel-w:640px;
}

*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--font);color:var(--text);font-size:var(--fs-base);
  min-height:100vh;min-height:100dvh;
  -webkit-font-smoothing:antialiased;line-height:1.5;overflow:hidden;
  background-color:var(--bg-deep);
  background-image:
    radial-gradient(54% 46% at 12% 8%, rgba(10,132,255,.20), transparent 70%),
    radial-gradient(46% 46% at 88% 14%, rgba(94,92,230,.18), transparent 70%),
    radial-gradient(60% 55% at 72% 96%, rgba(100,210,255,.14), transparent 70%),
    linear-gradient(var(--grid-line) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
  background-size:100% 100%,100% 100%,100% 100%,var(--grid-size) var(--grid-size),var(--grid-size) var(--grid-size);
  background-position:center;
  background-attachment:fixed,fixed,fixed,fixed,fixed;
}
/* 浅色主题：与主页 body 用同一组渐变参数（否则「浅色」下背景色相/浓度对不上） */
[data-theme="light"] body{
  background-image:
    radial-gradient(54% 46% at 12% 8%, rgba(0,122,255,.14), transparent 70%),
    radial-gradient(46% 46% at 88% 14%, rgba(88,86,214,.12), transparent 70%),
    radial-gradient(60% 55% at 72% 96%, rgba(0,163,255,.10), transparent 70%),
    linear-gradient(var(--grid-line) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
  background-size:100% 100%,100% 100%,100% 100%,var(--grid-size) var(--grid-size),var(--grid-size) var(--grid-size);
}

/* ===== 全局焦点环（与主页一致） ===== */
:focus{outline:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--radius-sm)}

/* ===== 液态玻璃背景光球（与主页 .liquid-bg 同一套动画与配色） ===== */
.liquid-bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.liquid-bg span{position:absolute;border-radius:50%;filter:blur(70px);opacity:.6;mix-blend-mode:screen;will-change:transform}
.liquid-bg span:nth-child(1){width:46vw;height:46vw;left:-6vw;top:-8vw;background:radial-gradient(circle,var(--glow-1) 0%,transparent 70%);animation:liquid1 22s ease-in-out infinite alternate}
.liquid-bg span:nth-child(2){width:40vw;height:40vw;right:-8vw;top:14vh;background:radial-gradient(circle,var(--glow-2) 0%,transparent 70%);animation:liquid2 27s ease-in-out infinite alternate}
.liquid-bg span:nth-child(3){width:52vw;height:52vw;left:26vw;bottom:-16vh;background:radial-gradient(circle,var(--glow-3) 0%,transparent 70%);animation:liquid3 24s ease-in-out infinite alternate}
[data-theme="light"] .liquid-bg span{mix-blend-mode:multiply;opacity:.42}
@keyframes liquid1{0%{transform:translate(0,0) scale(1)}100%{transform:translate(7vw,5vh) scale(1.12)}}
@keyframes liquid2{0%{transform:translate(0,0) scale(1)}100%{transform:translate(-6vw,4vh) scale(1.08)}}
@keyframes liquid3{0%{transform:translate(0,0) scale(1)}100%{transform:translate(4vw,-7vh) scale(1.15)}}

/* ===== 双栏布局：品牌说明 + 登录表单 ===== */
.login-page{position:relative;z-index:1;display:flex;min-height:100vh;min-height:100dvh}

/* 左：品牌区（玻璃面，与主页 .card 同一形态：--card + --glass-border + --blur） */
.brand-panel{
  position:relative;flex:0 0 46%;max-width:var(--login-panel-w);overflow:hidden;
  padding:var(--space-3xl);
  display:flex;flex-direction:column;justify-content:space-between;gap:var(--space-2xl);
  background:var(--card);border-right:1px solid var(--glass-border);
  box-shadow:var(--shadow), inset 0 1px 0 var(--glass-hi);
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  color:var(--text);
}
.brand-inner{position:relative;z-index:1;display:flex;flex-direction:column;gap:var(--space-xl)}
.brand-head{display:flex;align-items:center;gap:10px}
/* 与主页侧栏 .brand .brand-logo 同一形态，仅按登录页尺寸放大一档 */
.brand-logo{
  width:40px;height:40px;border-radius:var(--radius);flex-shrink:0;
  background:var(--gradient-brand);color:#fff;
  display:flex;align-items:center;justify-content:center;
  box-shadow:var(--shadow-glow);
}
.brand-logo svg{width:24px;height:24px}
.brand-name{font-family:var(--font-display);font-size:var(--fs-xl);font-weight:700;letter-spacing:-.3px;color:var(--text)}
.brand-ver{
  font-size:var(--fs-xs);font-weight:600;color:var(--text3);margin-left:auto;
  padding:2px 8px;border-radius:999px;background:var(--card-2);border:1px solid var(--border);
}

/* 主标题：主页 HUD 同一套「品牌渐变」口径（accent → accent2），
   只让**第二行**吃渐变，避免整段文字在两套主题下观感不一致。
   注意：这里**不能**把 var(--text) 放进渐变里 —— 浅色主题下 --text 是近黑色，
   落在 --bg-deep 深底上对比度只有 ~1.2:1，整行字会「糊掉」（本轮实测踩到过）。 */
.brand-hero h1{
  font-family:var(--font-display);font-size:var(--fs-2xl);line-height:1.3;font-weight:700;
  letter-spacing:-.6px;color:var(--text);
}
.brand-hero h1 .grad{
  background-image:var(--gradient-brand);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;
}
.brand-hero p{margin-top:10px;font-size:var(--fs-base);color:var(--text2);max-width:32ch}

.brand-feats{display:flex;flex-direction:column;gap:var(--space-md);margin-top:var(--space-md)}
.feat{display:flex;align-items:center;gap:12px}
.feat-ic{
  width:34px;height:34px;border-radius:var(--radius-sm);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  background:var(--accent-wash);border:1px solid var(--border);color:var(--accent);
}
.feat-ic svg{width:18px;height:18px}
.feat-tx b{display:block;font-size:var(--fs-base);font-weight:600;color:var(--text)}
.feat-tx span{font-size:var(--fs-sm);color:var(--text3)}

.brand-foot{position:relative;z-index:1;font-size:var(--fs-xs);color:var(--text3)}

/* 图标承载元素 */
.icon{display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;flex-shrink:0}
.icon svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon-16{width:16px;height:16px}
.icon-18{width:18px;height:18px}
.icon-20{width:20px;height:20px}
.icon-24{width:24px;height:24px}

/* 右：表单区 */
.form-panel{
  position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:var(--space-lg);padding:var(--space-2xl);width:100%;overflow-y:auto;
}
.theme-btn{
  position:absolute;top:var(--space-md);right:var(--space-md);
  width:36px;height:36px;border-radius:var(--radius-sm);border:1px solid var(--border);
  background:var(--card);color:var(--text2);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  transition:background var(--transition-fast),border-color var(--transition-fast),color var(--transition-fast);
  z-index:2;
}
.theme-btn:hover{background:var(--card-2);border-color:var(--border2);color:var(--text)}
.theme-btn:active{transform:scale(.95)}

/* 登录卡片：与主页 .card 同形态；这里额外疊一层渐变高光，保留原本的「被抬起」观感 */
.login-card{
  position:relative;z-index:1;
  width:var(--login-card-w);max-width:100%;
  padding:var(--space-3xl) var(--space-2xl);
  border-radius:var(--radius-lg);
  border:1px solid var(--glass-border);
  background-image:linear-gradient(160deg, rgba(255,255,255,.10), rgba(255,255,255,0));
  background-color:var(--card);
  box-shadow:var(--shadow), inset 0 1px 0 var(--glass-hi);
  -webkit-backdrop-filter:var(--blur-xl);backdrop-filter:var(--blur-xl);
  transition:border-color var(--transition-normal), box-shadow var(--transition-normal);
}
.login-card:hover{border-color:var(--glass-border-strong)}
[data-theme="light"] .login-card{
  background-image:linear-gradient(160deg, rgba(255,255,255,.85), rgba(255,255,255,0));
}
.login-card h1{
  font-family:var(--font-display);font-size:var(--fs-xl);font-weight:700;letter-spacing:-.4px;
  color:var(--text);margin-bottom:4px;
}
.login-subtitle{font-size:var(--fs-sm);color:var(--text3);margin-bottom:var(--space-xl)}

.form-group{margin-bottom:var(--space-lg);position:relative}
.form-group label{
  display:block;font-size:var(--fs-xs);color:var(--text2);margin-bottom:var(--space-xs);
  font-weight:600;font-family:var(--font-display);letter-spacing:.3px;
  transition:color var(--transition-fast);
}
.form-group:focus-within label{color:var(--accent)}
.form-group .input-wrap{position:relative}
/* 输入框与主页 input[type=text] 对齐：11px 内边距 + tokens 的字段底色 */
.form-group input{
  width:100%;padding:11px 14px 11px 40px;
  border-radius:var(--radius-sm);border:1px solid var(--border);
  background:var(--field-bg);color:var(--text);
  font-size:var(--fs-base);font-family:var(--font);
  transition:border-color var(--transition-fast),box-shadow var(--transition-fast);
}
.form-group input::placeholder{color:var(--text3);opacity:.85}
.form-group input:hover{border-color:var(--border2)}
.form-group input:focus{
  outline:none;border-color:var(--accent);box-shadow:var(--focus-ring);
}
.form-group .input-icon{
  position:absolute;left:12px;top:50%;transform:translateY(-50%);
  color:var(--text3);transition:color var(--transition-fast);pointer-events:none;
}
.form-group:focus-within .input-icon{color:var(--accent)}
.form-group .toggle-pass{
  position:absolute;right:6px;top:50%;transform:translateY(-50%);
  width:30px;height:30px;border-radius:var(--radius-sm);border:none;background:transparent;
  color:var(--text3);cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:background var(--transition-fast),color var(--transition-fast);
}
.form-group .toggle-pass:hover{color:var(--accent);background:var(--accent-wash)}

/* 主按钮：与主页 .btn-primary 同一渐变出处（--gradient-btn） */
.btn{
  width:100%;padding:12px;border-radius:var(--radius-sm);border:none;
  background:var(--gradient-btn);color:#fff;font-size:var(--fs-base);font-weight:600;
  cursor:pointer;margin-top:var(--space-xs);font-family:var(--font-display);letter-spacing:.3px;
  display:flex;align-items:center;justify-content:center;gap:var(--space-sm);
  transition:filter var(--transition-fast),transform var(--transition-fast);
}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:scale(.99)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:grayscale(.3);transform:none}
.btn .spinner{width:18px;height:18px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* 错误提示：仅对「出现」做一次强调动画，不再抖 4 下 */
.error{
  color:var(--red);font-size:var(--fs-sm);text-align:center;margin-top:var(--space-md);
  display:none;padding:10px 12px;border-radius:var(--radius-xs);
  background:var(--red-wash);border:1px solid var(--red-border);font-weight:500;
}
.error.show{display:block;animation:errorIn var(--transition-normal) both}
@keyframes errorIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}

.login-last{
  margin-top:var(--space-md);text-align:center;font-size:var(--fs-xs);color:var(--text3);
  display:none;align-items:center;justify-content:center;gap:6px;
}
.login-last.show{display:flex}
.login-last svg{width:14px;height:14px;color:var(--text3);flex-shrink:0}

/* 辅助信息：玻璃面，窄于卡片 */
.login-note{
  position:relative;z-index:1;
  width:var(--login-card-w);max-width:100%;display:flex;align-items:flex-start;gap:10px;
  padding:12px 14px;border-radius:var(--radius);
  border:1px solid var(--glass-border);background:var(--card);
  color:var(--text3);font-size:var(--fs-sm);line-height:1.55;
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
}
.login-note svg{width:18px;height:18px;flex-shrink:0;color:var(--accent);margin-top:1px}
.login-note b{color:var(--text2);font-weight:600}
.login-footer{margin-top:0;text-align:center;font-size:var(--fs-xs);color:var(--text3);position:relative;z-index:1}

/* 5.3 性能降级：不支持 backdrop-filter 时退化为不透明实底（与 main.css 同策略） */
@supports not ((backdrop-filter: blur(4px)) or (-webkit-backdrop-filter: blur(4px))){
  .brand-panel,.login-card,.login-note,.theme-btn{
    -webkit-backdrop-filter:none;backdrop-filter:none;
    background-color:var(--surface-solid);
  }
}

/* ===== 响应式 ===== */
@media(max-width:860px){
  .login-page{flex-direction:column;min-height:100dvh}
  .brand-panel{
    flex:none;max-width:none;padding:var(--space-lg) var(--space-xl);
    flex-direction:row;align-items:center;gap:12px;border-right:none;border-bottom:1px solid var(--glass-border);
  }
  .brand-inner{flex-direction:row;align-items:center;gap:12px;width:100%}
  .brand-head{gap:9px}
  .brand-logo{width:34px;height:34px}
  .brand-logo svg{width:20px;height:20px}
  .brand-name{font-size:var(--fs-lg)}
  .brand-ver{margin-left:0}
  .brand-hero,.brand-feats,.brand-foot{display:none}
  .form-panel{padding:var(--space-xl) var(--space-md);justify-content:flex-start}
}
@media(max-width:480px){
  .login-card{width:100%;padding:var(--space-xl) var(--space-lg)}
  .login-card h1{font-size:var(--fs-xl)}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}
</style>
</head>

</svg>

<div class="liquid-bg" aria-hidden="true"><span></span><span></span><span></span></div>

<div class="login-page">
  <!-- 左：品牌区 -->
  <aside class="brand-panel">
    <div class="brand-inner">
      <div class="brand-head">
        <div class="brand-logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#icon-cloud-download"/></svg></div>
        <div class="brand-name">豆瓣自动转存<span class="brand-ver">v1.1.0</span></div>
      </div>
      <div class="brand-hero">
        <h1>把豆瓣榜单，<br><span class="grad">自动搬进你的网盘</span></h1>
        <p>本地 / NAS 部署的影视自动转存后台，省去逐个手动检索。</p>
      </div>
      <div class="brand-feats">
        <div class="feat">
          <div class="feat-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#icon-cloud-download"/></svg></div>
          <div class="feat-tx"><b>一键转存</b><span>豆瓣 / 榜单资源批量转存到网盘</span></div>
        </div>
        <div class="feat">
          <div class="feat-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#icon-clock"/></svg></div>
          <div class="feat-tx"><b>定时调度</b><span>按你设定的时间自动执行</span></div>
        </div>
        <div class="feat">
          <div class="feat-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#icon-check-circle"/></svg></div>
          <div class="feat-tx"><b>失败监控</b><span>实时日志与状态，成功失败一目了然</span></div>
        </div>
      </div>
    </div>
    <div class="brand-foot">© 2026 DBAuto · 数据本地加密存储</div>
  </aside>

  <!-- 右：表单区 -->
  <main class="form-panel">
    <button class="theme-btn" id="themeBtn" onclick="toggleTheme()" title="切换主题" aria-label="切换主题"><span class="icon icon-20"><svg><use href="#icon-moon"/></svg></span></button>
    <div class="login-card">
      <h1>登录</h1>
      <p class="login-subtitle">登录以管理您的影视自动转存</p>
      <div class="form-group">
        <label for="user">用户名</label>
        <div class="input-wrap">
          <span class="input-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#icon-user"/></svg></span>
          <input type="text" id="user" placeholder="请输入用户名" onkeydown="if(event.key==='Enter')focusPass()">
        </div>
      </div>
      <div class="form-group">
        <label for="pass">密码</label>
        <div class="input-wrap">
          <span class="input-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#icon-lock"/></svg></span>
          <input type="password" id="pass" placeholder="请输入密码" onkeydown="if(event.key==='Enter')login()">
          <button class="toggle-pass" onclick="togglePass()" title="显示/隐藏密码" id="passToggleBtn" aria-label="显示或隐藏密码">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#icon-eye"/></svg>
          </button>
        </div>
      </div>
      <button class="btn" id="btn" onclick="login()">登 录</button>
      <div class="error" id="error"></div>
      <p class="login-last" id="loginLast"></p>
    </div>
    <div class="login-note">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#icon-lock"/></svg>
      <span><b>首次部署？</b>默认账号信息请在服务端配置文件中查看。账号密码经本地加密存储，登录流量仅在您的内网 / 本机间传输，不会上传第三方。</span>
    </div>
    <p class="login-footer">安全登录 · 数据本地加密存储</p>
  </main>
</div>

<script>
var passVisible = false;

function initTheme(){
  var t = localStorage.getItem('theme')||'dark';
  document.documentElement.setAttribute('data-theme',t);
  var icon = t==='dark'?'icon-moon':'icon-sun';
  document.querySelector('#themeBtn .icon').innerHTML = '<svg><use href="#'+icon+'"/></svg>';
}
function toggleTheme(){
  var cur = document.documentElement.getAttribute('data-theme');
  var next = cur==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',next);
  localStorage.setItem('theme',next);
  var icon = next==='dark'?'icon-moon':'icon-sun';
  document.querySelector('#themeBtn .icon').innerHTML = '<svg><use href="#'+icon+'"/></svg>';
}
initTheme();

function focusPass(){document.getElementById('pass').focus()}

var lockTimer = null;

// 显示上次登录时间 / IP（本地缓存，下次访问登录页时提示）
function showLastLogin(){
  try{
    var raw = localStorage.getItem('dbauto_last_login');
    if(!raw) return;
    var rec = JSON.parse(raw);
    if(!rec || !rec.time) return;
    var el = document.getElementById('loginLast');
    if(!el) return;
    el.textContent = '';
    var svgns = 'http://www.w3.org/2000/svg';
    var icon = document.createElementNS(svgns,'svg');
    icon.setAttribute('viewBox','0 0 24 24');
    icon.setAttribute('fill','none');
    icon.setAttribute('stroke','currentColor');
    icon.setAttribute('stroke-width','2');
    icon.setAttribute('stroke-linecap','round');
    icon.setAttribute('stroke-linejoin','round');
    var use = document.createElementNS(svgns,'use');
    use.setAttribute('href','#icon-clock');
    icon.appendChild(use);
    el.appendChild(icon);
    var span = document.createElement('span');
    var txt = '上次登录：' + rec.time;
    if(rec.ip) txt += ' · ' + rec.ip;
    span.textContent = txt;
    el.appendChild(span);
    el.classList.add('show');
  }catch(e){}
}

// 锁定倒计时
function startLockCountdown(wait){
  var btn = document.getElementById('btn');
  var err = document.getElementById('error');
  if(lockTimer){clearInterval(lockTimer);lockTimer=null}
  btn.disabled = true;
  var left = wait || 300;
  function fmt(s){var m=Math.floor(s/60),sec=s%60;return m+' 分 '+(sec<10?'0':'')+sec+' 秒'}
  function tick(){
    if(left<=0){
      if(lockTimer){clearInterval(lockTimer);lockTimer=null}
      err.classList.remove('show');
      btn.disabled=false;
      btn.innerHTML='登 录';
      return;
    }
    err.textContent='尝试次数过多，账号已锁定，请 '+fmt(left)+' 后重试';
    err.classList.add('show');
    btn.innerHTML='已锁定 '+fmt(left);
    left--;
  }
  tick();
  lockTimer=setInterval(tick,1000);
}

function togglePass(){
  passVisible = !passVisible;
  var input = document.getElementById('pass');
  var btn = document.getElementById('passToggleBtn');
  input.type = passVisible ? 'text' : 'password';
  btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#'+(passVisible?'icon-eye-off':'icon-eye')+'"/></svg>';
}

if(localStorage.getItem('auth_token')){
  var tok = localStorage.getItem('auth_token');
  fetch('/api/categories',{headers:{'X-Auth-Token':tok}}).then(function(r){
    if(r.ok)location.href='/';
    else localStorage.removeItem('auth_token');
  });
}
showLastLogin();

async function login(){
  var user = document.getElementById('user').value.trim();
  var pass = document.getElementById('pass').value;
  var btn = document.getElementById('btn');
  var err = document.getElementById('error');
  var success = false;

  err.classList.remove('show');
  if(!user){err.textContent='请输入用户名';err.classList.add('show');return}
  if(!pass){err.textContent='请输入密码';err.classList.add('show');return}

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> 登录中...';

  try{
    var r = await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:user,password:pass})});
    var d = await r.json();
    if(d.success){
      success = true;
      if(d.last_login){localStorage.setItem('dbauto_last_login', JSON.stringify(d.last_login))}
      btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg> 登录成功';
      localStorage.setItem('auth_token',d.token);
      setTimeout(function(){location.href='/'},500);
    } else if(r.status === 429){
      startLockCountdown(d.wait || 300);
    } else {
      var remain = (typeof d.remaining === 'number') ? d.remaining : null;
      var msg = d.message || '登录失败，请检查用户名和密码';
      if(remain !== null && remain > 0){ msg += '（还剩 ' + remain + ' 次尝试机会）'; }
      err.textContent = msg;
      err.classList.add('show');
    }
  }catch(e){
    err.textContent = '网络连接失败，请检查网络';
    err.classList.add('show');
  }
  if(!success){
    btn.disabled = false;
    btn.innerHTML = '登 录';
  }
}
</script>
</body>
</html>
