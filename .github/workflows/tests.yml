name: Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # 与 .env.example / docker/Dockerfile / docker-compose.yml 保持一致。
      # 原因：config.LOCAL_TZ 由 TZ 环境变量推导（缺省回退东八区），而
      # routes_history 的「今日」统计走 time.strftime/localtime（系统时区）。
      # runner 默认 TZ 未设置且系统为 UTC，两者会在 UTC 16:00-23:59
      # （= 北京 00:00-07:59）对不上，导致「今日转存」类断言失败。
      TZ: Asia/Shanghai
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies (locked)
        run: |
          python -m pip install --upgrade pip
          # 从锁定版（含 hash）安装，保证 CI 与产物可复现，消除浮动版本带来的测试抖动
          pip install --require-hashes -r requirements.txt -r requirements/requirements-dev.txt

      - name: Dependency vulnerability scan
        run: |
          pip install pip-audit
          # 基于锁定清单做供应链漏洞扫描；发现已知漏洞时本步骤非零退出，阻断合并
          pip-audit -r requirements.txt -r requirements/requirements-dev.txt --desc on

      - name: Lint (ruff)
        run: |
          pip install ruff
          # 仅启用 F（pyflakes 缺陷）+ E9（语法错误），不阻塞风格；首次若有违规按需修复或加 # noqa
          ruff check .

      - name: Frontend build drift check
        run: |
          # 重建前端产物并确认与仓库内产物一致（防止只改 src 未重建 / 直接手改产物）
          bash static/src/build.sh
          if ! git diff --quiet -- static/index_new.html; then
            echo "::error::static/index_new.html 与 static/src 源文件不一致，请执行 bash static/src/build.sh 后提交产物"
            git --no-pager diff --stat -- static/index_new.html
            exit 1
          fi

      - name: Contrast audit (WCAG 2.1 AA)
        run: |
          # UI 路线图 4.1：设计令牌对比度门禁，低于 4.5:1 阻断合并
          python scripts/check_contrast.py --report docs/UI_Contrast_Report.md

      - name: Run tests (per-file isolation)
        run: |
          set -e -o pipefail
          echo "=== Running pytest ==="
          python -m pytest tests/ --tb=long -v --reruns 2 --reruns-delay 3 -r a \
            2>&1 | tee pytest-ci.log
          echo "=== Exit code: $? ==="

      - name: Print test log on failure
        if: failure()
        run: |
          if [ -f pytest-ci.log ]; then
            echo "========== pytest-ci.log (begin) =========="
            cat pytest-ci.log
            echo "========== pytest-ci.log (end) =========="
          else
            echo "pytest-ci.log not found — pytest process may have crashed before writing output."
          fi

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: pytest-ci.log
          retention-days: 7
