name: Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests cryptography croniter pytest pytest-rerunfailures

      - name: Run tests (per-file isolation)
        run: |
          set -e
          echo "=== Running pytest ==="
          python -m pytest tests/ --tb=long -v --reruns 2 --reruns-delay 3 -r a \
            2>&1 | tee test_output.txt
          echo "=== Exit code: $? ==="

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: test_output.txt
          retention-days: 7
