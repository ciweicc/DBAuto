name: Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies (locked)
        run: |
          python -m pip install --upgrade pip
          # 从锁定版（含 hash）安装，保证 CI 与产物可复现，消除浮动版本带来的测试抖动
          pip install --require-hashes -r requirements.txt -r requirements-dev.txt

      - name: Dependency vulnerability scan
        run: |
          pip install pip-audit
          # 基于锁定清单做供应链漏洞扫描；发现已知漏洞时本步骤非零退出，阻断合并
          pip-audit -r requirements.txt -r requirements-dev.txt --desc on

      - name: Run tests (per-file isolation)
        run: |
          set -e
          echo "=== Running pytest ==="
          python -m pytest tests/ --tb=long -v --reruns 2 --reruns-delay 3 -r a \
            2>&1 | tee test_output.txt
          echo "=== Exit code: $? ==="

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: test_output.txt
          retention-days: 7
