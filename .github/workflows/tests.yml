name: Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies (locked)
        run: |
          python -m pip install --upgrade pip
          # 从锁定版（含 hash）安装，保证 CI 与产物可复现，消除浮动版本带来的测试抖动
          pip install --require-hashes -r requirements.txt -r requirements/requirements-dev.txt

      - name: Dependency vulnerability scan
        run: |
          pip install pip-audit
          # 基于锁定清单做供应链漏洞扫描；发现已知漏洞时本步骤非零退出，阻断合并
          pip-audit -r requirements.txt -r requirements/requirements-dev.txt --desc on

      - name: Lint (ruff)
        run: |
          pip install ruff
          # 仅启用 F（pyflakes 缺陷）+ E9（语法错误），不阻塞风格；首次若有违规按需修复或加 # noqa
          ruff check .

      - name: Run tests (per-file isolation)
        run: |
          set -e -o pipefail
          echo "=== Running pytest ==="
          python -m pytest tests/ --tb=long -v --reruns 2 --reruns-delay 3 -r a \
            2>&1 | tee pytest-ci.log
          echo "=== Exit code: $? ==="

      - name: Print test log on failure
        if: failure()
        run: |
          if [ -f pytest-ci.log ]; then
            echo "========== pytest-ci.log (begin) =========="
            cat pytest-ci.log
            echo "========== pytest-ci.log (end) =========="
          else
            echo "pytest-ci.log not found — pytest process may have crashed before writing output."
          fi

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: pytest-ci.log
          retention-days: 7
